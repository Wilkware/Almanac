name: Continuous Integration

on: [push, pull_request]

jobs:
  style:
    name: Run Check Style
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@master

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: 8.2
        
    - name: Run PHP-CS-Fixer
      uses: wilkware/action-ips-style@main

  stan:
    name: Run Static Analysis
    runs-on: ubuntu-latest
    needs: style
    steps:
      - name: Checkout repository
        uses: actions/checkout@master

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.2

      - name: Clone SymconStubs
        run: git clone https://github.com/symcon/SymconStubs.git ../_ips-stubs

      - name: Install PHPStan
        run: |
          wget https://github.com/phpstan/phpstan/releases/latest/download/phpstan.phar -O phpstan.phar
          chmod +x phpstan.phar

      - name: Run PHPStan
        run: php phpstan.phar analyse --configuration=phpstan.neon